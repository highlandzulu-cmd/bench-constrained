id: BUG-01
suite: core-coding
category: bugfix
title: Fix broken add() in mini-calc

repo:
  type: fixture
  path: fixtures/mini-calc-buggy
  commit: HEAD

prompt: |
  The `add` function in this project is wrong and tests fail.
  Fix the implementation so `cargo test` passes.
  Do not change test code unless absolutely necessary.

success:
