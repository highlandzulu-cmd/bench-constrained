id: WEB-BUG-01
suite: core-coding
category: bugfix
title: Fix remainingCount() in mini-web todos

repo:
  type: fixture
  path: fixtures/mini-web
  commit: HEAD

prompt: |
  `remainingCount` in js/todo.js is wrong and tests fail. Fix the
  implementation so `node --test tests/remaining.test.js` passes.
  Do not change test code unless absolutely necessary.

success:
