# Builds the task image on GitHub's runners and publishes it to ghcr.io, so no builder is needed on the cluster.
# Result: ghcr.io/<owner>/bench-tasks:0.1  (the package must be public for the cluster to pull it without a secret)
name: image
on:
  push:
    branches: [main]
    paths: ["image/**", "bench/**", "config/**", "fixtures/**", "solutions/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64        # every node in the cluster is amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bench-tasks:0.1
            ghcr.io/${{ github.repository_owner }}/bench-tasks:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  translator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          file: image/translator.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bench-translator:0.1
          cache-from: type=gha,scope=translator
          cache-to: type=gha,scope=translator,mode=max
