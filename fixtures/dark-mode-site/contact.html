<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Aurora Studio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Aurora Studio</a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav>
      <ul class="site-nav" id="site-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Get in touch</h1>
      <p>Tell us about your project. We reply within one business day.</p>
    </section>

    <form id="contact-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button class="button" type="submit">Send message</button>
      <p id="form-status" role="status"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Aurora Studio. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
