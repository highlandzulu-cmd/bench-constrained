<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mini-web todos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>todos</h1>
      <form id="add-form">
        <input
          id="new-todo"
          type="text"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
      </form>
      <ul id="todo-list"></ul>
      <footer class="bar">
        <span id="remaining">0 left</span>
        <nav class="filters">
          <button type="button" data-filter="all" class="is-active">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </nav>
        <button type="button" id="clear-completed">Clear completed</button>
      </footer>
    </main>
    <script src="js/todo.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
