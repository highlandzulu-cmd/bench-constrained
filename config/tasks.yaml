# Generated by `bench gen-tasks` from the 13 task files. Edit the task files, not this.
# verify_cmd runs with `sh -c` in the work copy of the fixture; exit 0 = pass.
tasks:
- id: BUG-01
  fixture: mini-calc-buggy
  prompt: |
    The `add` function in this project is wrong and tests fail.
    Fix the implementation so `cargo test` passes.
    Do not change test code unless absolutely necessary.
  verify_cmd: cargo test
  timeout_s: 900
  tier: T1
  needs_node_modules: false
- id: FEAT-01
  fixture: mini-calc
  prompt: |
    Extend `parse_verbose_flag` in src/lib.rs so it returns true for both
    `-v` and `--verbose` (same as `-v` today).
    Update or add tests to cover `--verbose`.
    Run `cargo test` when done.
  verify_cmd: 'cargo run -q -- add 2 3 --verbose 2>&1 | grep -q "verbose: add 2 3 -> 5"'
  timeout_s: 1200
  tier: T1
  needs_node_modules: false
- id: FEAT-02
  fixture: dark-mode-site
  prompt: |
    This is a small multi-page static website (index.html, about.html,
    services.html, contact.html, sharing css/style.css and js/app.js) that has
    no dark mode. Add a toggle control (e.g. a button) that switches the site
    between light and dark themes, on every page.

    Requirements, exactly:
    1. The toggle element must have id="theme-toggle", present on every page
    of the site (not just the homepage) - if the site shares a header
    across pages, add it there once; otherwise add it to each page.
    2. Clicking it sets document.documentElement.dataset.theme to "dark" or
    "light" (i.e. an attribute data-theme="dark"/"light" on the <html>
    element), flipping each time it's clicked, on whichever page you're on.
    3. The chosen theme is persisted to localStorage under the key "theme",
    shared across all pages (the same browser tab storage already is).
    4. On a fresh load of any page, if a theme was previously stored, it is
    applied immediately (no extra click needed) - real persistence across
    reloads and across pages, not just saving a value nobody reads back.
    5. All existing page content and functionality must keep working on every
    page (nav, forms, etc).

    You may style the actual dark/light colors however you like - only the
    mechanism above (id, attribute, localStorage key, on every page) is
    checked automatically, not the visual design.
  verify_cmd: node --test tests/dark-mode.test.js
  timeout_s: 1200
  tier: T1
  needs_node_modules: true
- id: FEAT-03
  fixture: dark-mode-site
  prompt: |
    On services.html, add a search box that filters the three service cards
    by text as the user types, with no page reload and no build step.

    Requirements, exactly:
    1. Add an <input id="service-search"> above the card grid
    (#service-cards).
    2. On every keystroke, hide any .card inside #service-cards whose
    visible text doesn't contain the typed query (case-insensitive
    substring match against the card's own text, including its heading
    and body). "Hide" means setting the card's `hidden` boolean DOM
    attribute (card.hidden = true), not just a CSS class, so hidden state
    is trivially checkable.
    3. Cards matching the query keep `hidden` false/absent.
    4. Clearing the search box shows every card again.

    Each card already has a stable data-id attribute (new-site, redesign,
    maintenance) - don't remove it, the grading test relies on it.
  verify_cmd: node --test tests/search.test.js
  timeout_s: 900
  tier: T1
  needs_node_modules: true
- id: FEAT-04
  fixture: dark-mode-site
  prompt: |
    On services.html, let visitors "favorite" individual service cards, with
    the choice persisted across reloads.

    Requirements, exactly:
    1. Add a button with class "favorite-toggle" inside each .card in
    #service-cards (each card already has a stable data-id attribute:
    new-site, redesign, maintenance - don't remove it).
    2. Clicking a card's toggle adds or removes that card's data-id from a
    JSON array stored in localStorage under the key "favorites" (toggle
    behavior: click once to add, click again on the same card to remove).
    3. The toggle reflects its own state via aria-pressed="true"/"false",
    updated immediately on click.
    4. Add an element with id="favorites-count" (anywhere in the header)
    showing the current number of favorited cards as plain text, updated
    immediately on every toggle.
    5. On a fresh page load, if localStorage already has favorites, both the
    count and every affected card's aria-pressed state must reflect that
    immediately - no click needed, no stale defaults.
  verify_cmd: node --test tests/favorites.test.js
  timeout_s: 1200
  tier: T1
  needs_node_modules: true
- id: FEAT-05
  fixture: dark-mode-site
  prompt: |
    The contact form on contact.html (#contact-form, fields #name, #email,
    #message) currently shows its "Thanks!" success message on every submit,
    even with empty or invalid fields. Add real client-side validation.

    Requirements, exactly:
    1. Name and Message are required (must be non-empty after trimming
    whitespace).
    2. Email must look like a real address (something@something.something -
    reject obviously malformed values like "not-an-email" or "dana@").
    3. Submitting with any invalid field must NOT show the existing "Thanks"
    success message in #form-status, and must not actually "submit"
    (preventDefault, as it already does).
    4. For each invalid field, show a non-empty error message in an element
    with id="<field>-error" (i.e. id="name-error", "email-error",
    "message-error") - add these elements next to their fields if they
    don't exist yet.
    5. Fixing the fields and submitting again must clear the errors back to
    empty text and show the success message, exactly as the form already
    does today for a submit you don't block.

    You do not need to validate on every keystroke - checking on submit is
    enough, as long as re-submitting after a fix clears old errors.
  verify_cmd: node --test tests/form-validation.test.js
  timeout_s: 1200
  tier: T1
  needs_node_modules: true
- id: FEAT-06
  fixture: dark-mode-site
  prompt: |
    The mobile nav (#nav-toggle button, #site-nav menu, shared across every
    page) only really works with a mouse today. Make it fully usable from
    the keyboard, on every page.

    Requirements, exactly:
    1. Clicking #nav-toggle to open the menu must move focus to the first
    link inside #site-nav.
    2. While the menu is open, pressing Escape (anywhere) must close it
    (remove the "open" class, set aria-expanded="false" on #nav-toggle,
    same as clicking the toggle to close) and move focus back to
    #nav-toggle.
    3. While the menu is open, pressing Tab while focus is on the LAST link
    inside #site-nav must move focus back to #nav-toggle, not out of the
    menu onto page content behind it.
    4. While the menu is open, pressing Shift+Tab while focus is on
    #nav-toggle must move focus to the LAST link inside #site-nav.
    5. The toggle button must keep working exactly as it does today
    (clicking it again while open still closes the menu).

    Note: a real focus trap needs your own keydown handling (listen for Tab/
    Shift+Tab and call .focus() + preventDefault() yourself) - relying on the
    browser's native tab order is not enough, since the menu's DOM siblings
    aren't actually removed from that order.
  verify_cmd: node --test tests/accessible-nav.test.js
  timeout_s: 1200
  tier: T1
  needs_node_modules: true
